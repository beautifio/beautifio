# Host Nginx reverse proxy for the Beautifio web app.
# Install to /etc/nginx/sites-available/beautifio and symlink into sites-enabled.
# Certbot (--nginx) will add the TLS server block + redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Allow larger uploads (images, story assets).
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_cache_bypass $http_upgrade;
    }
}
