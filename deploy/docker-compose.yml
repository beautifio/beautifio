# Runs the Next.js app container. Host Nginx (see deploy/nginx.conf) terminates
# TLS and proxies to 127.0.0.1:3000 — the app is never exposed publicly itself.
services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: beautifio-web:latest
    container_name: beautifio-web
    restart: always
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3000:3000"
